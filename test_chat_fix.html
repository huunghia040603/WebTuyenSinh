<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #f8fafc;
        }

        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: 0.9rem 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-body {
            height: 400px;
            overflow: auto;
            padding: 1rem;
            background: #fafbff;
        }

        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            border-top: 1px dashed #e5e7eb;
            background: #fff;
            padding-bottom: 0px;
            overflow: hidden;
            position: relative;
        }

        .chat-suggestions .chip {
            padding: 0.45rem 0.7rem;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            background: #fff;
            color: #334155;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform-origin: center;
        }

        .chat-suggestions .chip::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .chat-suggestions .chip:hover::before {
            width: 100%;
            height: 100%;
        }

        .chat-suggestions .chip:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.15);
            z-index: 10;
            border-color: #6366f1;
            color: #6366f1;
        }

        .message {
            margin: 0.5rem 0;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message .bubble {
            display: inline-block;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            max-width: 78%;
            font-size: 13px;
        }

        .message.user .bubble {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: #fff;
        }

        .message.ai .bubble {
            background: #eef2ff;
            color: #1e293b;
            border: 1px solid #e5e7eb;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 15px;
            background: #eef2ff;
            border-radius: 14px;
            width: fit-content;
            margin: 10px 0;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% {
                transform: translate3d(0,0,0);
            }
            40%, 43% {
                transform: translate3d(0, -30px, 0);
            }
            70% {
                transform: translate3d(0, -15px, 0);
            }
            90% {
                transform: translate3d(0, -4px, 0);
            }
        }

        .test-button {
            padding: 1rem 2rem;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 1rem;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>
    <h1>🧪 Test Chat Fix</h1>
    
    <div class="chat-container">
        <div class="chat-header">
            <span>🤖</span>
            Trợ lý tư vấn AI
        </div>
        
        <div class="chat-body" id="chat-body">
            <!-- Messages will be added here -->
        </div>
        
        <div class="chat-suggestions" id="chat-suggestions">
            <button class="chip" onclick="testChip(this)">Tư vấn chọn ngành theo điểm mạnh</button>
            <button class="chip" onclick="testChip(this)">Xu hướng việc làm năm 2025</button>
            <button class="chip" onclick="testChip(this)">Lộ trình học để vào ngành Data/AI</button>
            <button class="chip" onclick="testChip(this)">Kết nối chuyên gia tư vấn</button>
        </div>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <button class="test-button" onclick="testTyping()">Test Typing Indicator</button>
        <button class="test-button" onclick="testMessage()">Test AI Message</button>
        <button class="test-button" onclick="clearChat()">Clear Chat</button>
    </div>

    <script>
        const chatBody = document.getElementById('chat-body');

        function showTypingIndicator() {
            // Xóa typing indicator cũ nếu có
            const existingTyping = document.querySelector('.typing-indicator');
            if (existingTyping) {
                existingTyping.remove();
            }
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai typing-indicator';
            typingDiv.innerHTML = `
                <div class="bubble">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatBody.appendChild(typingDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            return typingDiv;
        }

        function appendMessage(role, text) {
            const wrap = document.createElement('div');
            wrap.className = `message ${role}`;
            wrap.innerHTML = `<div class="bubble">${text}</div>`;
            chatBody.appendChild(wrap);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function testTyping() {
            const typingIndicator = showTypingIndicator();
            
            // Tự động xóa sau 3 giây
            setTimeout(() => {
                if (typingIndicator && typingIndicator.parentNode) {
                    typingIndicator.remove();
                }
            }, 3000);
        }

        function testMessage() {
            const typingIndicator = showTypingIndicator();
            
            setTimeout(() => {
                if (typingIndicator && typingIndicator.parentNode) {
                    typingIndicator.remove();
                }
                appendMessage('ai', '**Xin chào! 👋** Đây là tin nhắn test để kiểm tra hiệu ứng typing indicator và chat suggestions.');
            }, 2000);
        }

        function testChip(chip) {
            chip.style.transform = 'scale(0.95)';
            setTimeout(() => {
                chip.style.transform = '';
            }, 150);
            
            appendMessage('user', chip.textContent);
            
            // Simulate AI response
            const typingIndicator = showTypingIndicator();
            setTimeout(() => {
                if (typingIndicator && typingIndicator.parentNode) {
                    typingIndicator.remove();
                }
                appendMessage('ai', `Tôi hiểu bạn muốn tìm hiểu về "${chip.textContent}". Hãy để tôi tư vấn chi tiết cho bạn! 😊`);
            }, 1500);
        }

        function clearChat() {
            chatBody.innerHTML = '';
        }

        // Hiển thị welcome message
        setTimeout(() => {
            appendMessage('ai', '**Xin chào! 👋** Tôi là trợ lý AI tư vấn tuyển sinh. Hãy test các hiệu ứng bên dưới!');
        }, 500);
    </script>
</body>
</html>
