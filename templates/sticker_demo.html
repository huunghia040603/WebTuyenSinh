<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Gửi Sticker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .demo-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .demo-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .demo-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-area {
            height: 400px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-message {
            display: flex;
            gap: 12px;
            max-width: 70%;
            animation: messageSlideIn 0.3s ease;
        }

        .chat-message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-message.own .chat-message-avatar {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .chat-message:not(.own) .chat-message-avatar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .chat-message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        .chat-message.own .chat-message-content {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .chat-message img {
            max-width: 160px;
            border-radius: 8px;
            display: block;
        }

        .chat-message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 11px;
            opacity: 0.7;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .sticker-btn {
            background: #f59e0b;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .sticker-btn:hover {
            background: #d97706;
            transform: scale(1.05);
        }

        .send-btn {
            background: #3b82f6;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .sticker-panel {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            max-width: 300px;
            z-index: 1000;
        }

        .sticker-panel.open {
            display: grid;
        }

        .sticker-item {
            width: 40px;
            height: 40px;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-item:hover {
            transform: scale(1.1);
        }

        .sticker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 10000;
            font-size: 14px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            max-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #059669;
            border-left: 4px solid #10b981;
        }

        .toast.error {
            background: #dc2626;
            border-left: 4px solid #ef4444;
        }

        .debug-info {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 16px;
            margin: 20px;
            font-family: monospace;
            font-size: 12px;
        }

        .debug-info h3 {
            margin-bottom: 8px;
            color: #374151;
        }

        .debug-info pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1>🎯 Demo Gửi Sticker</h1>
            <p>Test tính năng gửi sticker với giao diện đơn giản</p>
        </div>

        <div class="debug-info">
            <h3>🔧 Debug Info:</h3>
            <pre id="debugOutput">Đang khởi tạo...</pre>
        </div>

        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message">
                    <div class="chat-message-avatar">B</div>
                    <div class="chat-message-content">
                        Chào bạn! Hãy thử gửi sticker nhé 😊
                        <div class="chat-message-meta">
                            <span>Bạn</span>
                            <span>Vừa xong</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Nhập tin nhắn... (Enter để gửi)">
                <button class="sticker-btn" onclick="toggleStickerPanel()">😊</button>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="sticker-panel" id="stickerPanel"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Debug function
        function debugLog(message, data = null) {
            const debugOutput = document.getElementById('debugOutput');
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            
            console.log(logMessage, data);
            
            if (data) {
                debugOutput.textContent = `${logMessage}\n${JSON.stringify(data, null, 2)}`;
            } else {
                debugOutput.textContent = logMessage;
            }
        }

        // Toast function
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Sticker functions
        function toggleStickerPanel() {
            const panel = document.getElementById('stickerPanel');
            panel.classList.toggle('open');
            
            if (panel.classList.contains('open')) {
                buildStickerPanel();
            }
            
            debugLog('Toggle sticker panel', { isOpen: panel.classList.contains('open') });
        }

        function buildStickerPanel() {
            const panel = document.getElementById('stickerPanel');
            if (panel.dataset.built === '1') return;

            debugLog('Building sticker panel...');
            panel.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#64748b; font-size:12px; padding:6px;">Đang tải sticker...</div>';

            const basePath = '/static/images/sticker/';
            const candidates = [];
            
            // Try 1..60.png
            for (let i = 1; i <= 60; i++) {
                candidates.push(`${i}.png`);
            }

            let loaded = 0;
            let appended = 0;
            panel.innerHTML = '';

            debugLog(`Trying to load ${candidates.length} stickers from ${basePath}`);

            candidates.forEach((name) => {
                const testImg = new Image();
                testImg.onload = () => {
                    const item = document.createElement('div');
                    item.className = 'sticker-item';
                    item.onclick = () => sendSticker(name);
                    
                    const img = document.createElement('img');
                    img.src = basePath + name;
                    img.alt = 'sticker';
                    img.onerror = () => debugLog(`Failed to load sticker: ${name}`);
                    
                    item.appendChild(img);
                    panel.appendChild(item);
                    appended++;
                    
                    debugLog(`Loaded sticker: ${name}`, { loaded: appended, total: candidates.length });
                };
                testImg.onerror = () => {
                    debugLog(`Sticker not found: ${name}`);
                };
                testImg.src = basePath + name;
                loaded++;
            });

            // Mark built after a short delay
            setTimeout(() => {
                if (panel.children.length === 0) {
                    panel.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#ef4444; font-size:12px; padding:6px;">Không tìm thấy sticker ở /static/images/sticker/</div>';
                    debugLog('No stickers found!');
                } else {
                    debugLog(`Successfully loaded ${panel.children.length} stickers`);
                }
                panel.dataset.built = '1';
            }, 1000);
        }

        async function sendSticker(fileName) {
            try {
                debugLog(`Sending sticker: ${fileName}`);
                
                // Close panel immediately
                const panel = document.getElementById('stickerPanel');
                if (panel) panel.classList.remove('open');

                // Optimistic UI
                const chatMessages = document.getElementById('chatMessages');
                const tempId = 'st_' + Date.now();
                const imgUrl = `/static/images/sticker/${fileName}`;
                
                const tempHTML = `
                    <div class="chat-message own" data-temp-id="${tempId}" style="opacity: 0; transform: translateY(10px);">
                        <div class="chat-message-avatar">B</div>
                        <div class="chat-message-content">
                            <img src="${imgUrl}" alt="sticker" />
                            <div class="chat-message-meta">
                                <span>Bạn</span>
                                <span>Đang gửi...</span>
                            </div>
                        </div>
                    </div>`;
                
                chatMessages.insertAdjacentHTML('beforeend', tempHTML);
                
                // Animate sticker appearance
                const tempEl = chatMessages.querySelector(`[data-temp-id="${tempId}"]`);
                if (tempEl) {
                    requestAnimationFrame(() => {
                        tempEl.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        tempEl.style.opacity = '1';
                        tempEl.style.transform = 'translateY(0)';
                    });
                }
                
                // Scroll to bottom smoothly
                chatMessages.scrollTo({
                    top: chatMessages.scrollHeight,
                    behavior: 'smooth'
                });

                // Simulate API call (for demo purposes)
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Success
                if (tempEl) tempEl.remove();
                showToast('✅ Sticker đã gửi thành công!', 'success');
                debugLog('Sticker sent successfully', { fileName, imgUrl });
                
                // Add final message
                const finalHTML = `
                    <div class="chat-message own">
                        <div class="chat-message-avatar">B</div>
                        <div class="chat-message-content">
                            <img src="${imgUrl}" alt="sticker" />
                            <div class="chat-message-meta">
                                <span>Bạn</span>
                                <span>Vừa xong</span>
                            </div>
                        </div>
                    </div>`;
                chatMessages.insertAdjacentHTML('beforeend', finalHTML);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
            } catch (e) {
                debugLog('Error sending sticker', e);
                showToast('❌ Lỗi khi gửi sticker', 'error');
            }
        }

        // Message functions
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            debugLog('Sending message', { message });
            
            const chatMessages = document.getElementById('chatMessages');
            const messageHTML = `
                <div class="chat-message own">
                    <div class="chat-message-avatar">B</div>
                    <div class="chat-message-content">
                        ${message}
                        <div class="chat-message-meta">
                            <span>Bạn</span>
                            <span>Vừa xong</span>
                        </div>
                    </div>
                </div>`;
            
            chatMessages.insertAdjacentHTML('beforeend', messageHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            input.value = '';
            showToast('✅ Tin nhắn đã gửi!', 'success');
        }

        // Enter to send
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Close sticker panel when clicking outside
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('stickerPanel');
            const stickerBtn = document.querySelector('.sticker-btn');
            
            if (panel && panel.classList.contains('open') && 
                !panel.contains(e.target) && 
                !stickerBtn.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('Demo page loaded successfully');
            debugLog('Current path', window.location.pathname);
            debugLog('Sticker path', '/static/images/sticker/');
        });
    </script>
</body>
</html>
