{% block stylesheets %}
<style>
    .suggestion-bar {
        background: #f7fbff;
        border: 1px solid #dbeafe;
        color: #0a4191;
        font-size: 1rem;
        padding: 0.7rem 1.2rem;
        border-radius: 10px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 0.7rem;
    }
    .suggestion-bar i {
        color: #0a4191;
        font-size: 1.2rem;
    }
    .majors-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 18px;
        margin-bottom: 18px;
    }
    .major-card {
        background: #fff;
        border: 1.5px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        padding: 1.1rem 1.2rem 1.1rem 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        position: relative;
        transition: box-shadow 0.2s;
    }
    .major-card:hover {
        box-shadow: 0 4px 16px rgba(10,65,145,0.10);
        border-color: #0a4191;
        background:     #e9f1ff;
    }
    .major-card-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }
    .major-logo {
        width: 54px;
        height: 54px;
        border-radius: 10px;
        object-fit: contain;
        background: #f7fbff;
        border: 1px solid #e5e7eb;
        padding: 5px;
    }
    .major-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #0a4191;
        margin-bottom: 2px;
        cursor: pointer;
        transition: color 0.2s;
        display: -webkit-box;
        -webkit-line-clamp: 1;      /* Hiển thị tối đa 2 dòng */
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: normal;         /* Cho phép xuống dòng */
        padding-right: 28px; /* Để chừa chỗ cho icon trái tim */
    }
    .major-title:hover {
        color: #0440af;
        text-decoration: underline;
    }
    .major-school {
        font-size: 0.9rem;
        color: #444;
        font-weight: 500;
        margin-bottom: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        max-width: 280px; /* hoặc 100% nếu cha đã có width cố định */
    }
    .major-info-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
    }
    .major-fee, .major-location, .major-diem {
        background: #f7fbff;
        color: #0a4191;
        font-size: 0.78rem;
        border-radius: 7px;
        padding: 0.18rem 0.3rem;
        font-weight: 600;
    }
    .major-location {
        background: #eaf6ff;
        color: #0440af;
    }
    .major-diem {
        background: #eaf6ff;
        color: #0440af;
    }
    .major-label {
        background: #ffb703;
        color: #fff;
        font-size: 0.6rem !important;
        font-weight: 600;
        border-radius: 13px;
        padding: 4px 10px !important;
        margin-right: 0.3rem;
        display: inline-block;
        margin-bottom: 0.4rem;
        text-transform: uppercase;
    }
    .major-label.conglap {
        background: #eaf6ff;
        color: #0440af;
        font-weight: 700;
    }
    .major-label.ngoaiconglap {
        background: #eaf6ff;
        color: #c57a00;
        font-weight: 700;
    }
    .major-label.noibat {
        background: #d01010;
    }
    .major-label.noibat {
    /* Define a wider gradient initially */
    background: linear-gradient(90deg, #eb5a3c, #ffb164, #bf2000); /* Added a third color stop for a repeating effect */
    background-size: 200% 100%; /* Make the background twice as wide as the element */
    color: #ffffff;
    animation: gradient-shift 2s infinite alternate; /* Changed animation name and duration */
}

.major-label.noibat::before {
    content: "✨"; /* Star icon */
    font-size: 0.5rem !important;
    color: #FFFFFF !important; /* Set star color to white */
    /* margin-right: 1px; */
    /* If you want the star itself to "sparkle" independently, you'd add its own animation here,
       like the `sparkle-glow` one we discussed for opacity.
       For now, let's keep it simple and focus on the background. */
}
/* New keyframes for smooth background-position animation */
@keyframes gradient-shift {
    0% {
        background-position: 0% 50%; /* Start at the beginning of the gradient */
    }
    100% {
        background-position: 100% 50%; /* Move the gradient fully to the right */
    }
}
    .major-label {
    /* Define a wider gradient initially */
    background: linear-gradient(90deg, #5ad345, #8dd663, #309501); /* Added a third color stop for a repeating effect */
    background-size: 200% 100%; /* Make the background twice as wide as the element */
    color: #ffffff;
    animation: gradient-shift 2s infinite alternate; /* Changed animation name and duration */
}

.major-label:before {
    font-size: 0.5rem !important;
    color: #FFFFFF !important; /* Set star color to white */
    /* margin-right: 1px; */
    /* If you want the star itself to "sparkle" independently, you'd add its own animation here,
       like the `sparkle-glow` one we discussed for opacity.
       For now, let's keep it simple and focus on the background. */
}
/* New keyframes for smooth background-position animation */
@keyframes gradient-shift {
    0% {
        background-position: 0% 50%; /* Start at the beginning of the gradient */
    }
    100% {
        background-position: 100% 50%; /* Move the gradient fully to the right */
    }
}
    .major-fav-btn {
        position: absolute;
        top: 1.1rem;
        right: 1.1rem;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0a4191;
        font-size: 1.2rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .major-fav-btn:hover {
        background: #eaf6ff;
        color: #ffb703;
        border-color: #ffb703;
    }
    .pagination-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.2rem;
        margin: 18px 0 10px 0;
    }
    .pagination-btn, .pagination-current {
        background: #fff;
        border: 1.5px solid #0a4191;
        color: #0a4191;
        border-radius: 8px;
        padding: 0.3rem 1.1rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .pagination-btn:hover {
        background: #0a4191;
        color: #fff;
    }
    .pagination-current {
        background: #0a4191;
        color: #fff;
        cursor: default;
    }
    @media (max-width: 700px) {
        .majors-grid {
            grid-template-columns: 1fr;
        }
        .major-card {
            padding: 0.7rem 0.7rem 0.7rem 0.7rem;
        }
        .suggestion-bar {
            font-size: 0.95rem;
            padding: 0.5rem 0.7rem;
        }
    }
    .majors-section {
        background: #eaeaea;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(10,65,145,0.07);
        max-width: 1300px;
        margin: 0 auto;
        margin-top: 0px;
        padding: 32px 18px 24px 18px;
        min-height: 900px; /* hoặc 650px, 800px tuỳ số card/trang và thiết kế */
        transition: min-height 0.2s;
    }
    @media (max-width: 700px) {
        .majors-section {
            padding: 12px 2vw 18px 2vw;
            margin-top: 16px;
            border-radius: 8px;
        }
    }
    /* Trong file CSS của bạn */
#loading-spinner {
    margin-top: 50px;
}

#loading-spinner i {
    font-size: 3em; /* Kích thước icon loading */
    color: #007bff; /* Màu sắc icon */
}

/* Loading styles */
.modern-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    width: 100%;
    margin: 0 auto;
}

.modern-loader-spinner {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 6px solid #e0e7ef;
    border-top: 6px solid #0a4191;
    border-right: 6px solid #ffa200;
    border-bottom: 6px solid #0c01ad;
    animation: modern-spin 1.1s linear infinite;
    box-shadow: 0 4px 24px #00e0ff33, 0 0 0 4px #fff8;
    margin-bottom: 18px;
}

@keyframes modern-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.modern-loader-text {
    font-size: 1.15rem;
    color: #0a4191;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 2px 12px #00e0ff22;
}
    </style>
{% endblock %}
{% block content %}
    <div class="majors-section">
       

        <div class="suggestion-bar">
            <i class="fas fa-info-circle"></i>
            Gợi ý: Di chuột vào tiêu đề ngành để xem thêm thông tin chi tiết
        </div>

        <div id="loadingContainer" class="modern-loader">
            <div class="modern-loader-spinner"></div>
            <div class="modern-loader-text">Đang tải thông tin ngành học...</div>
        </div>

        <div class="majors-grid" id="majors-grid">
        </div>

        <div class="pagination-bar" id="pagination-bar">
        </div>
    </div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
{% block scripts %}
<script src="/static/js/nganh.js"></script>

{% endblock %}
