{% block stylesheets %}
<style>
      html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }
.doitac-section {
    max-width: 1200px;
    margin: 48px auto 32px auto;
    padding: 0 12px;
}
.doitac-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: #0a4191;
    margin-bottom: 0.8em;
    text-align: left;
    letter-spacing: 0.01em;
}
.doitac-slider-wrap {
    width: 100vw;
    left: 50%;
    transform: translateX(-50%);
    position: relative;
    overflow: hidden;
    margin-bottom: 40px;
}
.doitac-slider-marquee {
    display: flex;
    align-items: center;
    gap: 36px;
    animation: doitac-marquee 32s linear infinite;
    will-change: transform;
}
.doitac-logo-card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 4px 24px rgba(10,65,145,0.09);
    min-width: 220px;
    max-width: 260px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 2px solid #e5e7eb;
    transition: box-shadow 0.2s, border 0.2s;
    flex-shrink: 0;
}
.doitac-logo-card:hover {
    box-shadow: 0 8px 32px #0a419133;
    border: 2px solid #0a4191;
}
.doitac-logo-img {
    max-width: 160px;
    max-height: 90px;
    object-fit: contain;
}
.doitac-top-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    background: #1ecb8b;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 4px 6px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
}
.doitac-float-logos {
    position: relative;
    width: 100vw;
    left: 50%;
    transform: translateX(-50%);
    height: 250px;
    margin-top: 48px;
    overflow: hidden;
    background: none;
  
}
.doitac-float-logo {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 24px #0a41911a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 2.5px solid #e5e7eb;
    animation: doitac-float-move 22s linear infinite;
    will-change: transform;
    cursor: pointer;
    overflow: hidden;
}

.doitac-float-logo:hover {
    border: 3.5px solid #0a4191;
    box-shadow: 0 12px 40px #0a419133;
    transform: scale(1.15) rotate(5deg);
    z-index: 10;
}

.doitac-float-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
    display: block;
    transition: transform 0.3s ease;
}

.doitac-float-logo:hover img {
    transform: scale(1.1);
}

@keyframes doitac-marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes doitac-float-move-1 {
    0%   { left: -120px; transform: translateY(0px) rotate(0deg);}
    20%  { transform: translateY(-18px) rotate(2deg);}
    40%  { transform: translateY(12px) rotate(-2deg);}
    60%  { transform: translateY(-10px) rotate(1deg);}
    80%  { transform: translateY(8px) rotate(-1deg);}
    100% { left: 100vw; transform: translateY(0px) rotate(0deg);}
}
@keyframes doitac-float-move-2 {
    0%   { left: -120px; transform: translateY(0px) rotate(0deg);}
    15%  { transform: translateY(10px) rotate(-2deg);}
    35%  { transform: translateY(-16px) rotate(2deg);}
    55%  { transform: translateY(8px) rotate(-1deg);}
    75%  { transform: translateY(-12px) rotate(1deg);}
    100% { left: 100vw; transform: translateY(0px) rotate(0deg);}
}
@keyframes doitac-float-move-3 {
    0%   { left: -120px; transform: translateY(0px) rotate(0deg);}
    25%  { transform: translateY(-12px) rotate(1deg);}
    50%  { transform: translateY(16px) rotate(-2deg);}
    75%  { transform: translateY(-8px) rotate(2deg);}
    100% { left: 100vw; transform: translateY(0px) rotate(0deg);}
}
@media (max-width: 900px) {
    .doitac-section { padding: 0 2vw; }
    .doitac-float-logos { height: 120px; }
    .doitac-float-logo { border-width: 2px; }
    .doitac-logo-card { min-width: 140px; max-width: 180px; height: 90px; }
    .doitac-logo-img { max-width: 90px; max-height: 50px; }
    .doitac-top-badge { font-size: 0.9rem; padding: 2px 10px; border-radius: 8px; }
}
@media (max-width: 600px) {
    .doitac-section { padding: 0 1vw; }
    .doitac-title { font-size: 1.1rem; }
    .doitac-float-logos { height: 70px; }
    .doitac-logo-card { min-width: 80px; max-width: 100px; height: 40px; }
    .doitac-logo-img { max-width: 30px; max-height: 20px; }
}
</style>
{% endblock %}

{% block content %}
<div class="doitac-section">
    <div class="doitac-title">Các trường nổi bật</div>
    <div class="doitac-slider-wrap">
        <div class="doitac-slider-marquee" id="doitac-slider-marquee">
            <!-- Logo nổi bật sẽ render ở đây -->
        </div>
    </div>
    <div class="doitac-float-logos" id="doitac-float-logos">
        <!-- Logo tròn sẽ render ở đây -->
    </div>
</div>
<script>
const marquee = document.getElementById('doitac-slider-marquee');
const floatLogos = document.getElementById('doitac-float-logos');
const usedTops = [];
function random(min, max) { return Math.random() * (max - min) + min; }
function getNonOverlapTop(size) {
    const total = usedTops.length + 1;
    const band = (floatLogos.offsetHeight || 220) / total;
    let idx = usedTops.length;
    let base = band * idx + band/2 - size/2;
    usedTops.push(base);
    if (base < 0) base = 0;
    if (base + size > (floatLogos.offsetHeight || 220)) base = (floatLogos.offsetHeight || 220) - size;
    return base;
}
function createFloatLogo(item, idx) {
    const size = random(50, 100);
    const div = document.createElement('a');
    div.className = 'doitac-float-logo';
    div.href = item.link;
    div.target = '_blank';
    div.style.width = div.style.height = size + 'px';
    div.style.top = getNonOverlapTop(size) + 'px';

    // Chọn ngẫu nhiên 1 trong 3 animation chuyển động lên xuống
    const anims = ['doitac-float-move-1', 'doitac-float-move-2', 'doitac-float-move-3'];
    const animName = anims[Math.floor(Math.random() * anims.length)];
    div.style.animationName = animName;

    // Animation duration, delay, timing function như cũ
    const animationVariants = [
        { duration: random(18, 32), delay: random(-25, -5), path: 'linear' },
        { duration: random(20, 35), delay: random(-30, -10), path: 'ease-in-out' },
        { duration: random(15, 28), delay: random(-20, -8), path: 'ease-out' },
        { duration: random(22, 38), delay: random(-35, -15), path: 'linear' }
    ];
    const variant = animationVariants[idx % animationVariants.length];
    div.style.animationDuration = variant.duration + 's';
    div.style.animationDelay = variant.delay + 's';
    div.style.animationTimingFunction = variant.path;

    div.addEventListener('mouseenter', () => {
        div.style.animationPlayState = 'paused';
        div.style.transform = 'scale(1.15) rotate(5deg)';
    });
    div.addEventListener('mouseleave', () => {
        div.style.animationPlayState = 'running';
        div.style.transform = 'scale(1) rotate(0deg)';
    });

    div.innerHTML = `<img src="${item.img}" alt="logo">`;
    floatLogos.appendChild(div);
}
// Fetch outstanding universities
async function fetchOutstandingUniversities() {
    const res = await fetch('https://webtimtruong.pythonanywhere.com/schools/?tag=outstanding');
    const data = await res.json();
    return data.results || [];
}

async function renderOutstandingLogos() {
    const universities = await fetchOutstandingUniversities();
    // Render slider
    marquee.innerHTML = '';
    for (let k = 0; k < 2; k++) {
        universities.forEach(u => {
            const card = document.createElement('a');
            card.className = 'doitac-logo-card';
            card.href = '/' + u.short_code; // chuyển đến trang chi tiết trường
            card.innerHTML = `
            <!-- <span class="doitac-top-badge"> TOP </span> -->
                <img src="${u.logo || '/static/images/logo/1.jpg'}" class="doitac-logo-img" alt="${u.name}">`;
            marquee.appendChild(card);
        });
    }
    // Render float logos
    floatLogos.innerHTML = '';
    usedTops.length = 0;
    universities.forEach((u, i) => {
        createFloatLogo({
            img: u.logo || '/static/images/logo/1.jpg',
            link: '/' + u.short_code
        }, i);
        createFloatLogo({
            img: u.logo || '/static/images/logo/1.jpg',
            link: '/' + u.short_code
        }, i);
       
    });
}
renderOutstandingLogos();
</script>
{% endblock %}
